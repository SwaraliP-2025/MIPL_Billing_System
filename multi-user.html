<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MIPL Billing Tracker (Multi-user)</title>
<style>
:root{--bg:#f4f6f9;--cd:#fff;--tx:#1b2330;--mu:#5b667a;--bd:#e2e6ed;--ac:#0b5cab;--ok:#16794c;--wn:#8a4b08;--er:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--cd:#18202b;--tx:#e8edf5;--mu:#9aa5b8;--bd:#2a3442;--ac:#5aa7ee;--ok:#4cc38a;--wn:#f0a64a;--er:#f08a80}}
:root[data-theme="dark"]{--bg:#0f141b;--cd:#18202b;--tx:#e8edf5;--mu:#9aa5b8;--bd:#2a3442;--ac:#5aa7ee;--ok:#4cc38a;--wn:#f0a64a;--er:#f08a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:flex;min-height:100vh}
#side{width:216px;flex:none;background:#12263f;color:#c9d6e6;padding:20px 12px;display:flex;flex-direction:column;gap:4px;z-index:20}
.brand{color:#fff;font-weight:700;font-size:15px;padding:0 10px 14px}.brand small{display:block;font-weight:400;color:#8fa5bf;font-size:11px}
#nav{display:flex;flex-direction:column;gap:4px}
#nav button{background:none;border:0;color:#c9d6e6;text-align:left;padding:11px 10px;border-radius:8px;cursor:pointer;font:inherit;min-height:44px}
#nav button:hover{background:#1c3556}#nav button.on{background:#0b5cab;color:#fff}
#who{margin-top:auto;font-size:12px;color:#8fa5bf;padding:10px}
#wrap{flex:1;min-width:0}
header{padding:16px 24px;display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
header h1{font-size:20px;margin:0;flex:1}#mb{display:none}
main{padding:0 24px 24px;max-width:1180px}
.btn{border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:10px 16px;border-radius:8px;cursor:pointer;font:inherit;min-height:44px;text-decoration:none;display:inline-flex;align-items:center}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:14px}.k b{display:block;font-size:22px;margin-top:2px}.k span{color:var(--mu);font-size:12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:16px}.card h3{margin:0 0 10px;font-size:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:10px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mu);font-size:12px;font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.cl{cursor:pointer}tr.cl:hover{background:var(--bg)}
.chip{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor}
.Paid{color:var(--ok)}.Partial{color:var(--wn)}.Unpaid{color:var(--mu)}.Overdue{color:var(--er)}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--ok)}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx);max-width:100%;min-height:44px}
input[type=checkbox]{min-height:0;width:18px;height:18px}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--tx);width:min(580px,94vw);max-height:90vh;padding:18px}dialog::backdrop{background:#0008}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}.fg .w{grid-column:1/-1}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--bd)}.neg{color:var(--er)}.tag{font-size:12px}
@media(max-width:820px){#side{position:fixed;top:0;bottom:0;left:0;padding-top:calc(env(safe-area-inset-top,0px) + 20px);transform:translateX(-105%);transition:transform .2s}#side.open{transform:none}#mb{display:inline-flex}header,main{padding-left:14px;padding-right:14px}}
@media(max-width:520px){.fg{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
</style></head><body>
<div id="app"><aside id="side"><div class="brand">MIPL Billing<small>Maha Infotech Pvt Ltd</small></div><nav id="nav"></nav><div id="who">…</div></aside><div id="wrap"><header><button class="btn" id="mb" aria-label="Menu" onclick="side.classList.toggle('open')">☰ Menu</button><h1 id="pt">Dashboard</h1><button class="btn p" id="nb" onclick="newInv()">+ New invoice</button></header><main id="m">Connecting…</main></div></div><dialog id="dlg"></dialog>
<script>
const DEFAULT_SITES=["Chhatrapati Sambhajinagar","Panvel","Mangalore","Jammu & Kashmir","Madhya Pradesh"];
let SITES=DEFAULT_SITES.slice();
let PR=[["Smart City Road Package PMC",0,"Aurangabad Smart City Dev. Corp.",85,2.5,5],["Water Grid Supervision",0,"Maharashtra Jeevan Pradhikaran",120,1.8,5],["Affordable Housing PMC",1,"CIDCO (PSU)",210,1.5,5],["STP & Drainage Project",1,"Panvel Municipal Corporation",64,2.2,0],["Berth Upgrade PMC",2,"New Mangalore Port Authority",150,1.75,5],["Refinery Expansion PMC",2,"Mangalore Refinery & Petrochemicals Ltd (MRPL)",48,2.4,0],["Tunnel Approach Road Supervision",3,"NHIDCL",310,1.2,5],["Bridges Package (R&B)",3,"J&K Public Works Dept",72,2,5],["State Highway Upgrade",4,"MP Road Development Corp",190,1.6,5],["Rural Water Supply",4,"MP Jal Nigam",95,2.1,0]].map((p,i)=>({id:"P"+(i+1),name:p[0],site:DEFAULT_SITES[p[1]],client:p[2],cost:p[3]*1e7,fee:p[4],ret:p[5]}));
let PAYMENT_METHODS=["NEFT","RTGS","IMPS","UPI","Cheque","Cash","Demand Draft","Bank transfer","PFMS","Other"];
const MS=[["Inception Report",15],["Design / DPR Stage",25],["Construction Stage 1",25],["Construction Stage 2",20],["Completion & Handover",15]];
const STG=["Draft","Submitted","Certified by authority","Paid"],KINDS=["Bill copy","Work order / measurement","TDS certificate","Payment advice"];
const ROLESX={Admin:"Everything incl. users, delete, audit",Accounts:"Invoices, payments, reconciliation, stages, files",Engineer:"Create invoices, attach files",Viewer:"Read only"};
const CAP={Accounts:{inv:1,pay:1,recon:1,attach:1,stage:1},Engineer:{inv:1,attach:1}};
const T=new Date(),TS=T.toISOString().slice(0,10);
const ad=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const age=d=>Math.floor((T-new Date(d))/864e5);
const f=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const c=n=>n>=1e7?"₹"+(n/1e7).toFixed(2)+" Cr":n>=1e5?"₹"+(n/1e5).toFixed(2)+" L":f(n);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let db,asset,dl,me,role="Viewer",INV=[],PAY=[],RL={},AUD=[],view="dash",F={site:"",st:"",q:""};
const can=a=>role=="Admin"||!!(CAP[role]||{})[a];
const log=act=>db.collection("audit").add({at:new Date().toISOString(),name:me.name,role,act}).catch(()=>{});
const P=id=>PR.find(p=>p.id==id)||PR[0];
function calc(v){const b=v.base*(1+(v.esc||0)/100),gst=b*v.gst/100,gross=b+gst,tIT=b*v.tdsIT/100,tG=b*v.tdsGST/100,rt=b*v.ret/100,ded=tIT+tG+rt+v.pen+v.oth,net=gross-ded;
const pays=PAY.filter(p=>p.inv==v.id),rec=pays.reduce((a,p)=>a+p.amt,0),bal=Math.max(Math.round(net-rec),0),a=age(v.date);
return{b,gst,gross,tIT,tG,rt,ded,net,rec,bal,age:a,pays,st:bal<=0&&v.stage!="Draft"?"Paid":a>45&&v.stage!="Draft"?"Overdue":rec>0?"Partial":"Unpaid"}}
const rows=()=>INV.map(v=>({v,p:P(v.pid),c:calc(v)}));
const sum=(a,fn)=>a.reduce((s,x)=>s+fn(x),0);
function updateSites(){SITES=[...new Set(DEFAULT_SITES.concat(PR.map(p=>p.site).filter(Boolean)))]}
const LOCAL_DB_KEY="mipl_multi_user_v1";
const localListeners=[];
function localData(){const value=localStorage.getItem(LOCAL_DB_KEY);const data=value?JSON.parse(value):{};return{roles:data.roles||{},inv:data.inv||{},pay:data.pay||{},audit:data.audit||{},settings:data.settings||{}}}
function localSnapshot(name,options={}){const data=localData()[name]||{};let docs=Object.keys(data).map(id=>({id,data:()=>({...data[id]})}));if(options.orderBy)docs.sort((a,b)=>String(a.data()[options.orderBy]).localeCompare(String(b.data()[options.orderBy]))*(options.desc?-1:1));if(options.limit)docs=docs.slice(0,options.limit);return{docs}}
function notifyLocalListeners(){localListeners.forEach(x=>x.callback(localSnapshot(x.name,x.options)))}
window.addEventListener("storage",e=>{if(e.key===LOCAL_DB_KEY)notifyLocalListeners()});
function localDb(){
const save=data=>{localStorage.setItem(LOCAL_DB_KEY,JSON.stringify(data));notifyLocalListeners()};
const doc=path=>{const [name,id]=path.split("/");return{
get:async()=>{const value=localData()[name][id];return{exists:!!value,data:()=>value?{...value}:undefined}},
set:async value=>{const data=localData();data[name][id]={...value};save(data)},
update:async value=>{const data=localData();if(!data[name][id])throw new Error("Cannot update missing "+name+" record "+id);data[name][id]={...data[name][id],...value};save(data)},
delete:async()=>{const data=localData();delete data[name][id];save(data)}
}};
const collection=(name,options={})=>({
add:async value=>{const id="l"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);const data=localData();data[name][id]={...value};save(data);return{id}},
onSnapshot:callback=>{const listener={name,options,callback};localListeners.push(listener);callback(localSnapshot(name,options));return()=>{const index=localListeners.indexOf(listener);if(index>=0)localListeners.splice(index,1)}},
orderBy:key=>collection(name,{...options,orderBy:key}),
limit:value=>collection(name,{...options,limit:value})
});
return{doc,collection}
}
const localAsset={upload:file=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve({id:"f"+Date.now().toString(36),url:reader.result});reader.onerror=()=>reject(reader.error||new Error("Could not read the selected file."));reader.readAsDataURL(file)})};
const localDownloads={save:async({filename,data})=>{const url=URL.createObjectURL(new Blob([data],{type:"text/csv;charset=utf-8"}));const link=document.createElement("a");link.href=url;link.download=filename;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}};
async function init(){
try{
db=localDb();me={id:"local-user",name:"Local User",isOwner:true};asset=localAsset;dl=localDownloads;
const savedProjects=await db.doc("settings/projects").get(),savedMethods=await db.doc("settings/payment-methods").get();
if(savedProjects.exists&&Array.isArray(savedProjects.data().items))PR=savedProjects.data().items;
if(savedMethods.exists&&Array.isArray(savedMethods.data().items))PAYMENT_METHODS=savedMethods.data().items;
updateSites();
if(!savedProjects.exists)await db.doc("settings/projects").set({items:PR});
if(!savedMethods.exists)await db.doc("settings/payment-methods").set({items:PAYMENT_METHODS});
const rr=db.doc("roles/"+me.id);if(!(await rr.get()).exists)await rr.set({role:me.isOwner?"Admin":"Viewer",name:me.name});
db.collection("roles").onSnapshot(s=>{RL={};s.docs.forEach(x=>RL[x.id]=x.data());role=(RL[me.id]||{}).role||"Viewer";rend()});
db.collection("inv").onSnapshot(s=>{INV=s.docs.map(x=>({...x.data(),id:x.id}));rend()});
db.collection("pay").onSnapshot(s=>{PAY=s.docs.map(x=>({...x.data(),id:x.id}));rend()});
db.collection("audit").orderBy("at","desc").limit(60).onSnapshot(s=>{AUD=s.docs.map(x=>x.data());if(view=="adm")rend()})
}catch(e){console.error("Could not start the local tracker",e);m.innerHTML='<div class="card">Could not open the local tracker: '+esc(e.message||e)+'</div>'}
}
function go(v){view=v;side.classList.remove("open");rend();scrollTo(0,0)}
function rend(){if(!db)return;who.innerHTML=esc(me.name)+"<br>Role: "+role+"<br>Local browser data";nb.style.display=can("inv")?"":"none";
const T_=[["dash","Dashboard"],["inv","Invoices"],["pro","Projects"],["pay","Payments"],["rem","Follow-ups"],["rep","Reports"]];if(role=="Admin")T_.push(["adm","Local profile & audit"]);
nav.innerHTML=T_.map(t=>`<button class="${view==t[0]?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("");pt.textContent=(T_.find(t=>view==t[0])||["",""])[1];
m.innerHTML={dash,inv,pro,pay,rem,rep,adm}[view]()}
function dash(){const R=rows(),o=R.filter(x=>x.c.bal>0&&x.v.stage!="Draft");
if(!R.length)return`<div class="card">No data yet. ${role=="Admin"?'<button class="btn p" onclick="demo()">Load demo data</button>':"Ask an Admin to load or enter data."}</div>`;
const K=[["Gross billed (incl. GST)",sum(R,x=>x.c.gross)],["Total deductions",sum(R,x=>x.c.ded)],["Net receivable",sum(R,x=>x.c.net)],["Received",sum(R,x=>x.c.rec)],["Outstanding",sum(R,x=>x.c.bal)],["Overdue (>45 days)",sum(R.filter(x=>x.c.st=="Overdue"),x=>x.c.bal)],["Unreconciled receipts",sum(PAY.filter(p=>!p.recon),p=>p.amt)]];
const bk=[["0-30 days",0,30],["31-60",31,60],["61-90",61,90],["90+",91,1e5]].map(b=>[b[0],sum(o.filter(x=>x.c.age>=b[1]&&x.c.age<=b[2]),x=>x.c.bal)]);
const dd=[["TDS – Income Tax","tIT"],["TDS – GST","tG"],["Retention / Security","rt"]].map(d=>[d[0],sum(R,x=>x.c[d[1]])]).concat([["Penalty / LD",sum(R,x=>x.v.pen)],["Other",sum(R,x=>x.v.oth)]]);
const nc=R.filter(x=>!x.v.cert&&x.c.rec>0&&!(x.v.files||[]).some(z=>z.kind=="TDS certificate")).length;
return`<div class="grid">${K.map((k,i)=>`<div class="k"><span>${k[0]}</span><b class="${i==5?"neg":""}">${c(k[1])}</b></div>`).join("")}</div>
<div class="card sc"><h3>Site-wise position</h3><table><tr><th>Site</th><th class="n">Gross billed</th><th class="n">Deductions</th><th class="n">Received</th><th class="n">Outstanding</th><th>Recovery</th></tr>${SITES.map(s=>{const a=R.filter(x=>x.p.site==s),net=sum(a,x=>x.c.net),rec=sum(a,x=>x.c.rec);return`<tr><td>${esc(s)}</td><td class="n">${c(sum(a,x=>x.c.gross))}</td><td class="n">${c(sum(a,x=>x.c.ded))}</td><td class="n">${c(rec)}</td><td class="n">${c(net-rec)}</td><td><div class="bar"><i style="width:${net?rec/net*100:0}%"></i></div></td></tr>`}).join("")}</table></div>
<div class="two"><div class="card"><h3>Outstanding ageing</h3>${bk.map(b=>`<div class="row"><span>${b[0]}</span><b>${c(b[1])}</b></div>`).join("")}</div>
<div class="card"><h3>Deductions</h3>${dd.map(b=>`<div class="row"><span>${b[0]}</span><b>${c(b[1])}</b></div>`).join("")}<div class="row"><span>Paid invoices missing TDS certificate</span><b class="neg">${nc}</b></div></div>
<div class="card"><h3>Bill pipeline</h3>${STG.map(s=>`<div class="row"><span>${s}</span><b>${R.filter(x=>x.v.stage==s).length} · ${c(sum(R.filter(x=>x.v.stage==s),x=>x.c.net))}</b></div>`).join("")}</div></div>`}
function inv(){const R=rows().filter(x=>(!F.site||x.p.site==F.site)&&(!F.st||x.c.st==F.st)&&(!F.q||(x.v.no+x.p.name+x.p.client).toLowerCase().includes(F.q.toLowerCase())));
return`<div class="f"><select onchange="F.site=this.value;rend()"><option value="">All sites</option>${SITES.map(s=>`<option ${F.site==s?"selected":""}>${esc(s)}</option>`).join("")}</select><select onchange="F.st=this.value;rend()"><option value="">All status</option>${["Paid","Partial","Unpaid","Overdue"].map(s=>`<option ${F.st==s?"selected":""}>${s}</option>`).join("")}</select><input placeholder="Search" value="${esc(F.q)}" onchange="F.q=this.value;rend()"><button class="btn" onclick="csv()">Export CSV</button></div>
<div class="card sc"><table><tr><th>Invoice</th><th>Date</th><th>Project / Authority</th><th>Milestone</th><th>Stage</th><th class="n">Net payable</th><th class="n">Received</th><th class="n">Balance</th><th class="n">Age</th><th>Status</th></tr>
${R.map(x=>`<tr class="cl" onclick="detail('${x.v.id}')"><td>${esc(x.v.no)}</td><td>${x.v.date}</td><td>${esc(x.p.name)}<br><small style="color:var(--mu)">${esc(x.p.client)} · ${esc(x.p.site)}</small></td><td>${esc(x.v.ms)}</td><td>${esc(x.v.stage)}</td><td class="n">${f(x.c.net)}</td><td class="n">${f(x.c.rec)}</td><td class="n">${f(x.c.bal)}</td><td class="n">${x.c.age}</td><td><span class="chip ${x.c.st}">${x.c.st}</span></td></tr>`).join("")||"<tr><td colspan='10'>No invoices.</td></tr>"}</table></div>`}
function pro(){const R=rows();return`<div class="f"><button class="btn p" onclick="projectForm()">+ Add project</button></div><div class="card sc"><table><tr><th>Project</th><th>Site</th><th>Authority</th><th class="n">Cost</th><th class="n">Fee %</th><th class="n">Contract fee</th><th>Billed</th><th class="n">Received</th><th class="n">Outstanding</th><th>Actions</th></tr>${PR.map(p=>{const a=R.filter(x=>x.p.id==p.id),fee=p.cost*p.fee/100,b=sum(a,x=>x.v.base);return`<tr><td>${esc(p.name)}</td><td>${esc(p.site)}</td><td>${esc(p.client)}</td><td class="n">${c(p.cost)}</td><td class="n">${p.fee}%</td><td class="n">${c(fee)}</td><td><div class="bar"><i style="width:${fee?Math.min(b/fee*100,100):0}%;background:var(--ac)"></i></div></td><td class="n">${c(sum(a,x=>x.c.rec))}</td><td class="n">${c(sum(a,x=>x.c.bal))}</td><td><button class="btn" onclick="projectForm('${p.id}')">Edit</button> <button class="btn" onclick="deleteProject('${p.id}')">Delete</button></td></tr>`}).join("")||'<tr><td colspan="10">No projects yet. Add a project to use it on new invoices.</td></tr>'}</table></div><div class="card"><h3>Payment methods</h3><p style="color:var(--mu)">Manage the choices shown when recording a payment. Changes apply to new payments; existing receipts keep their recorded method.</p><div class="f"><button class="btn p" onclick="paymentMethodForm()">+ Add payment method</button></div>${PAYMENT_METHODS.map((method,i)=>`<div class="row"><span>${esc(method)}</span><span><button class="btn" onclick="paymentMethodForm(${i})">Edit</button> <button class="btn" onclick="deletePaymentMethod(${i})">Remove</button></span></div>`).join("")||'<div style="color:var(--mu)">No payment methods configured. Add one before recording a payment.</div>'}</div>`}
function projectForm(id){const p=id?PR.find(x=>x.id==id):null;if(id&&!p){alert("Project not found.");return}oo(`<h3 style="margin-top:0">${p?"Edit":"Add"} project</h3><div class="fg"><label class="w">Project name<input id="projectName" required maxlength="120" value="${esc(p?p.name:"")}"></label><label>Site / location<input id="projectSite" required maxlength="120" value="${esc(p?p.site:"")}"></label><label>Client / authority<input id="projectClient" required maxlength="120" value="${esc(p?p.client:"")}"></label><label>Project cost (₹ crore)<input id="projectCost" type="number" min="0" step="any" required value="${p?p.cost/1e7:""}"></label><label>Fee (%)<input id="projectFee" type="number" min="0" step="any" required value="${p?p.fee:""}"></label><label>Retention (%)<input id="projectRetention" type="number" min="0" step="any" required value="${p?p.ret:"0"}"></label></div><p style="color:var(--mu)">Projects added here appear in the project dropdown when creating an invoice.</p><div class="f"><button class="btn" onclick="cl()">Cancel</button><button class="btn p" onclick="saveProject('${id||""}')">Save project</button></div>`)}
async function saveProject(id){const name=projectName.value.trim(),site=projectSite.value.trim(),client=projectClient.value.trim(),cost=Number(projectCost.value),fee=Number(projectFee.value),ret=Number(projectRetention.value);if(!name||!site||!client||![cost,fee,ret].every(Number.isFinite)||cost<0||fee<0||ret<0){alert("Enter a project name, site, client, and valid non-negative cost and percentages.");return}const project=id?PR.find(x=>x.id==id):null;if(id&&!project){alert("Project not found.");return}const value={id:id||newProjectId(),name,site,client,cost:cost*1e7,fee,ret},next=project?PR.map(x=>x.id==id?value:x):PR.concat(value);try{await db.doc("settings/projects").set({items:next});PR=next;updateSites();log((project?"Updated":"Added")+" project "+name);cl();rend()}catch(e){alert("Could not save project: "+(e.message||e))}}
function newProjectId(){let n=1;while(PR.some(p=>p.id=="P"+n))n++;return"P"+n}
async function deleteProject(id){const project=PR.find(x=>x.id==id);if(!project){alert("Project not found.");return}if(PR.length<=1){alert("Keep at least one project so invoices can be created.");return}if(INV.some(v=>v.pid==id)){alert("This project has invoices and cannot be deleted. You can edit its details instead.");return}if(!confirm("Delete project "+project.name+"?"))return;const next=PR.filter(x=>x.id!=id);try{await db.doc("settings/projects").set({items:next});PR=next;updateSites();log("Deleted project "+project.name);rend()}catch(e){alert("Could not delete project: "+(e.message||e))}}
function paymentMethodForm(index){const existing=Number.isInteger(index)?PAYMENT_METHODS[index]:null;if(Number.isInteger(index)&&existing===undefined){alert("Payment method not found.");return}oo(`<h3 style="margin-top:0">${existing===null?"Add":"Edit"} payment method</h3><label class="fg"><span>Method name</span><input id="paymentMethodName" required maxlength="60" value="${esc(existing||"")}"></label><p style="color:var(--mu)">Examples: UPI, NEFT, RTGS, IMPS, cheque, cash, Demand Draft, or PFMS. Choose the options your business actually uses.</p><div class="f"><button class="btn" onclick="cl()">Cancel</button><button class="btn p" onclick="savePaymentMethod(${Number.isInteger(index)?index:"null"})">Save method</button></div>`)}
async function savePaymentMethod(index){const name=paymentMethodName.value.trim();if(!name){alert("Enter a payment method name.");return}if(PAYMENT_METHODS.some((method,i)=>method.toLowerCase()==name.toLowerCase()&&i!==index)){alert("That payment method already exists.");return}if(index!==null&&PAYMENT_METHODS[index]===undefined){alert("Payment method not found.");return}const next=PAYMENT_METHODS.slice();if(index===null)next.push(name);else next[index]=name;try{await db.doc("settings/payment-methods").set({items:next});PAYMENT_METHODS=next;log((index===null?"Added":"Updated")+" payment method "+name);cl();rend()}catch(e){alert("Could not save payment method: "+(e.message||e))}}
async function deletePaymentMethod(index){const method=PAYMENT_METHODS[index];if(method===undefined){alert("Payment method not found.");return}if(!confirm("Remove "+method+" from new payment choices? Existing receipts will keep this method."))return;const next=PAYMENT_METHODS.filter((_,i)=>i!==index);try{await db.doc("settings/payment-methods").set({items:next});PAYMENT_METHODS=next;log("Removed payment method "+method);rend()}catch(e){alert("Could not remove payment method: "+(e.message||e))}}
function pay(){const L=PAY.map(p=>({p,v:INV.find(v=>v.id==p.inv)})).filter(x=>x.v).sort((a,b)=>b.p.date.localeCompare(a.p.date));
return`<div class="card sc"><h3>Payment reconciliation</h3><p style="color:var(--mu)">Mark each receipt after verifying it against the bank statement.</p><table><tr><th>Date</th><th>Invoice</th><th>Authority</th><th>Mode</th><th>UTR / Ref</th><th class="n">Amount</th><th>Bank statement match</th></tr>${L.map(x=>`<tr><td>${x.p.date}</td><td>${esc(x.v.no)}</td><td>${esc(P(x.v.pid).client)}</td><td>${esc(x.p.mode)}</td><td>${esc(x.p.utr)}</td><td class="n">${f(x.p.amt)}</td><td><input type="checkbox" ${x.p.recon?"checked":""} ${can("recon")?"":"disabled"} onchange="recon('${x.p.id}',this.checked)"> ${x.p.recon?`<small>${esc(x.p.rby||"")}</small>`:""}</td></tr>`).join("")}<tr><th colspan="5">Total · unreconciled ${f(sum(L.filter(x=>!x.p.recon),x=>x.p.amt))}</th><th class="n">${f(sum(L,x=>x.p.amt))}</th><th></th></tr></table></div>`}
function recon(id,v){db.doc("pay/"+id).update({recon:v,rby:me.name});log((v?"Reconciled ":"Unreconciled ")+"receipt "+id)}
function rem(){const R=rows().filter(x=>x.c.st=="Overdue").sort((a,b)=>b.c.age-a.c.age);
return`<div class="card sc"><h3>Overdue follow-ups (credit period 45 days)</h3><table><tr><th>Invoice</th><th>Authority</th><th class="n">Balance</th><th class="n">Age</th><th>Action level</th></tr>${R.map(x=>{const lv=x.c.age>90?"Final notice – escalate to department head":x.c.age>60?"Second reminder":"First reminder";
return`<tr><td>${esc(x.v.no)}</td><td>${esc(x.p.client)}</td><td class="n">${f(x.c.bal)}</td><td class="n">${x.c.age} d</td><td>${lv}</td></tr>`}).join("")||"<tr><td>Nothing overdue 🎉</td></tr>"}</table></div>`}
function rep(){const R=rows(),cl=[...new Set(PR.map(p=>p.client))],mo={};PAY.forEach(p=>mo[p.date.slice(0,7)]=(mo[p.date.slice(0,7)]||0)+p.amt);
return`<div class="f"><button class="btn" onclick="csv()">Download invoice register (CSV)</button></div><div class="two"><div class="card sc"><h3>Authority-wise</h3><table><tr><th>Authority</th><th class="n">Net billed</th><th class="n">Received</th><th class="n">Balance</th><th class="n">Avg days to pay</th></tr>${cl.map(k=>{const a=R.filter(x=>x.p.client==k),pd=a.filter(x=>x.c.pays.length).map(x=>Math.max(...x.c.pays.map(p=>(new Date(p.date)-new Date(x.v.date))/864e5)));return`<tr><td>${esc(k)}</td><td class="n">${c(sum(a,x=>x.c.net))}</td><td class="n">${c(sum(a,x=>x.c.rec))}</td><td class="n">${c(sum(a,x=>x.c.bal))}</td><td class="n">${pd.length?Math.round(sum(pd,z=>z)/pd.length):"–"}</td></tr>`}).join("")}</table></div>
<div class="card"><h3>Monthly collections</h3>${Object.keys(mo).sort().map(k=>`<div class="row"><span>${k}</span><b>${c(mo[k])}</b></div>`).join("")}</div></div>`}
function adm(){return`<div class="card sc"><h3>Local profile</h3><p style="color:var(--mu)">This Live Server version stores data only in this browser. User accounts and shared roles require a hosted backend.</p><table><tr><th>User</th><th>Role</th></tr><tr><td>${esc(me.name)}</td><td>Admin</td></tr></table>${INV.length?"":'<button class="btn p" onclick="demo()">Load demo data</button>'}</div>
<div class="card sc"><h3>Audit log</h3><table>${AUD.map(a=>`<tr><td>${a.at.slice(0,16).replace("T"," ")}</td><td>${esc(a.name)} (${a.role})</td><td>${esc(a.act)}</td></tr>`).join("")}</table></div>`}
function setRole(id,r){db.doc("roles/"+id).update({role:r});log("Set "+RL[id].name+" to "+r)}
function oo(h){dlg.innerHTML=h;dlg.showModal()}
function cl(){dlg.close()}
function detail(id){const v=INV.find(x=>x.id==id),p=P(v.pid),k=calc(v),r=(a,b,z)=>`<div class="row"><span>${a}</span><b class="${z||""}">${b}</b></div>`;
oo(`<h3 style="margin-top:0">${esc(v.no)} <span class="chip ${k.st}">${k.st}</span></h3><div style="color:var(--mu)">${esc(p.name)} · ${esc(p.client)} · ${esc(p.site)}<br>${esc(v.ms)} · ${v.date} · ${k.age} days old</div><br>
${r("Base fee",f(v.base))}${v.esc?r("Price escalation @"+v.esc+"%","+ "+f(k.b-v.base)):""}${r("GST @"+v.gst+"%","+ "+f(k.gst))}${r("Gross",f(k.gross))}${r("TDS – IT @"+v.tdsIT+"%","− "+f(k.tIT),"neg")}${r("TDS – GST @"+v.tdsGST+"%","− "+f(k.tG),"neg")}${r("Retention @"+v.ret+"%","− "+f(k.rt),"neg")}${r("Penalty / LD","− "+f(v.pen),"neg")}${r("Other","− "+f(v.oth),"neg")}${r("Net payable",f(k.net))}${r("Received",f(k.rec))}${r("Balance",f(k.bal),k.bal?"neg":"")}
<p style="margin:10px 0 4px"><b>Stage</b> <select ${can("stage")?"":"disabled"} onchange="stage('${id}',this.value)">${STG.map(s=>`<option ${v.stage==s?"selected":""}>${s}</option>`).join("")}</select></p>
<p style="margin:10px 0 4px"><b>Payments</b></p>${k.pays.map(x=>`<div class="row"><span>${x.date} · ${esc(x.mode)} · ${esc(x.utr)}</span><b>${f(x.amt)}</b></div>`).join("")||"<div style='color:var(--mu)'>None yet</div>"}
<p style="margin:10px 0 4px"><b>Attachments</b></p>${(v.files||[]).map(z=>`<div class="row"><span>${esc(z.kind)}</span><a href="${z.url}" target="_blank" rel="noopener">${esc(z.name)}</a></div>`).join("")||"<div style='color:var(--mu)'>None yet</div>"}
${can("attach")&&asset?`<div class="f" style="margin-top:8px">${KINDS.map(kd=>`<label class="btn">＋ ${kd}<input type="file" hidden onchange="up('${id}','${kd}',this)"></label>`).join("")}</div>`:""}
<div class="f" style="margin-top:10px"><button class="btn" onclick="cl()">Close</button>${can("pay")&&k.bal>0?`<button class="btn p" onclick="payF('${id}')">Record payment</button>`:""}${role=="Admin"?`<button class="btn" onclick="del('${id}')">Delete</button>`:""}</div>`)}
async function up(id,kind,inp){const fl=inp.files[0];if(!fl)return;try{const r=await asset.upload(fl),v=INV.find(x=>x.id==id);v.files=(v.files||[]).concat([{kind,name:fl.name,id:r.id,url:r.url}]);await db.doc("inv/"+id).update({files:v.files});log("Attached "+kind+" to "+v.no);detail(id)}catch(e){alert("Upload failed: "+(e.message||e.code))}}
function stage(id,s){db.doc("inv/"+id).update({stage:s});log("Stage of "+INV.find(x=>x.id==id).no+" → "+s)}
async function del(id){if(!confirm("Delete this invoice and its payments?"))return;const v=INV.find(x=>x.id==id);await Promise.all(PAY.filter(p=>p.inv==id).map(p=>db.doc("pay/"+p.id).delete()));await db.doc("inv/"+id).delete();log("Deleted "+v.no);cl()}
function payF(id){const k=calc(INV.find(x=>x.id==id));oo(`<h3 style="margin-top:0">Record payment</h3><div class="fg"><label>Amount (₹)<input id="pa" type="number" value="${k.bal}"></label><label>Date<input id="pd" type="date" value="${TS}"></label><label>Mode<select id="pm">${PAYMENT_METHODS.map(method=>`<option value="${esc(method)}">${esc(method)}</option>`).join("")}</select></label><label>UTR / Cheque no.<input id="pu"></label></div>${PAYMENT_METHODS.length?"":'<p style="color:var(--er)">No payment methods are configured. Add one from the Projects screen first.</p>'}<p style="color:var(--mu)">Balance due: ${f(k.bal)}</p><div class="f"><button class="btn" onclick="cl()">Cancel</button><button class="btn p" ${PAYMENT_METHODS.length?"":"disabled"} onclick="addPay('${id}',${k.bal})">Save</button></div>`)}
async function addPay(id,bal){const a=+pa.value;if(!(a>0)||a>bal){alert("Enter an amount between 1 and the balance due.");return}if(!PAYMENT_METHODS.includes(pm.value)){alert("Choose a configured payment method.");return}await db.collection("pay").add({inv:id,date:pd.value,amt:a,utr:pu.value||"—",mode:pm.value,recon:false});log("Payment "+f(a)+" on "+INV.find(x=>x.id==id).no);cl()}
function newInv(){oo(`<h3 style="margin-top:0">New invoice</h3><div class="fg"><label class="w">Project<select id="np" onchange="pv()">${PR.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} – ${esc(p.site)}</option>`).join("")}</select></label><label>Milestone<input id="nm" value="Milestone bill"></label><label>Date<input id="nd" type="date" value="${TS}"></label><label>% of contract fee<input id="nx" type="number" value="15" oninput="pv()"></label><label>Price escalation %<input id="ne" type="number" value="0" oninput="pv()"></label><label>GST %<input id="ng" type="number" value="18" oninput="pv()"></label><label>TDS-IT %<input id="ni" type="number" value="10" oninput="pv()"></label><label>TDS-GST %<input id="nt" type="number" value="2" oninput="pv()"></label><label>Retention %<input id="nr" type="number" value="5" oninput="pv()"></label><label>Penalty / LD (₹)<input id="nl" type="number" value="0" oninput="pv()"></label><label>Other (₹)<input id="no" type="number" value="0" oninput="pv()"></label></div><div id="pvw" class="card" style="margin-top:10px"></div><div class="f"><button class="btn" onclick="cl()">Cancel</button><button class="btn p" onclick="addInv()">Create</button></div>`);pv()}
function mk(){const p=P(np.value);return{no:"MIPL/"+p.site.slice(0,3).toUpperCase()+"/26-27/"+String(INV.length+1).padStart(3,"0"),pid:p.id,date:nd.value,ms:nm.value,base:Math.round(p.cost*p.fee/100*(+nx.value)/100),esc:+ne.value,gst:+ng.value,tdsIT:+ni.value,tdsGST:+nt.value,ret:+nr.value,pen:+nl.value,oth:+no.value,cert:false,stage:"Draft",files:[]}}
function pv(){const k=calc({...mk(),id:"x"});pvw.innerHTML=`<div class="row"><span>Gross</span><b>${f(k.gross)}</b></div><div class="row"><span>Deductions</span><b class="neg">${f(k.ded)}</b></div><div class="row"><span>Expected net</span><b>${f(k.net)}</b></div>`}
async function addInv(){const v=mk();await db.collection("inv").add(v);log("Created invoice "+v.no);cl();view="inv";rend()}
async function demo(){if(INV.length&&!confirm("Data exists. Add demo data anyway?"))return;let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647,W=[];let n=1;
PR.forEach((p,k)=>{const cnt=3+k%3;for(let i=0;i<cnt;i++){const date=ad("2025-12-01",k*12+i*50+Math.floor(r()*8));if(new Date(date)>T)break;const base=Math.round(p.cost*p.fee/100*MS[i][1]/100),id="d"+n;
const v={no:"MIPL/"+p.site.slice(0,3).toUpperCase()+"/25-26/"+String(n).padStart(3,"0"),pid:p.id,date,ms:MS[i][0],base,esc:i>2?3:0,gst:18,tdsIT:10,tdsGST:2,ret:p.ret,pen:r()<.2?Math.round(base*.01):0,oth:r()<.15?Math.round(base*.005):0,cert:false,files:[],stage:i<cnt-2?"Paid":i==cnt-2?"Certified by authority":"Submitted"};
W.push(db.doc("inv/"+id).set(v));const net=calc({...v,id}).net,amt=i<cnt-2?Math.round(net):i==cnt-2?Math.round(net*.6):0,pd=ad(date,25+Math.floor(r()*50));
if(amt>0&&new Date(pd)<=T)W.push(db.doc("pay/dp"+n).set({inv:id,date:pd,amt,utr:"UTR"+Math.floor(1e11+r()*9e11),mode:r()<.6?"RTGS":"NEFT",recon:i<cnt-2}));n++}});
await Promise.all(W);log("Loaded demo data")}
async function csv(){const h=["Invoice","Date","Site","Authority","Project","Milestone","Stage","Base","Escalation","GST","TDS-IT","TDS-GST","Retention","Penalty","Other","Net","Received","Balance","Status"];
const q=z=>'"'+String(typeof z=="number"?Math.round(z):z).replace(/"/g,'""')+'"',L=rows().map(x=>[x.v.no,x.v.date,x.p.site,x.p.client,x.p.name,x.v.ms,x.v.stage,x.v.base,x.c.b-x.v.base,x.c.gst,x.c.tIT,x.c.tG,x.c.rt,x.v.pen,x.v.oth,x.c.net,x.c.rec,x.c.bal,x.c.st].map(q).join(","));
const t=[h.map(q).join(",")].concat(L).join("\n");try{if(dl)await dl.save({filename:"mipl-billing.csv",data:t});else throw 0}catch(e){if(e&&e.code=="declined")return;alert("Download isn't available in this view.")}}
init();
</script></body></html>
