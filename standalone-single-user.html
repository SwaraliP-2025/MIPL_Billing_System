<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>MIPL Billing Tracker</title>
<style>
:root{--bg:#f4f6f9;--cd:#fff;--tx:#1b2330;--mu:#667085;--bd:#e2e6ed;--ac:#0b5cab;--ok:#16794c;--wn:#b45309;--er:#b42318;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10141b;--cd:#18202b;--tx:#e8edf5;--mu:#98a2b3;--bd:#2a3442;--ac:#5aa7ee;--ok:#4cc38a;--wn:#f0a64a;--er:#f07a70}}
:root[data-theme="dark"]{--bg:#10141b;--cd:#18202b;--tx:#e8edf5;--mu:#98a2b3;--bd:#2a3442;--ac:#5aa7ee;--ok:#4cc38a;--wn:#f0a64a;--er:#f07a70}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:14px 18px;border-bottom:1px solid var(--bd);background:var(--cd);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:17px;margin:0}h1 small{display:block;color:var(--mu);font-weight:400;font-size:12px}
nav{display:flex;gap:4px;flex-wrap:wrap;padding:10px 18px 0}
nav button{border:0;background:none;color:var(--mu);padding:8px 14px;border-bottom:2px solid transparent;cursor:pointer;font:inherit}
nav button.on{color:var(--ac);border-color:var(--ac);font-weight:600}
main{padding:14px 18px;max-width:1300px;margin:auto}
.btn{border:1px solid var(--bd);background:var(--cd);color:var(--tx);padding:7px 12px;border-radius:7px;cursor:pointer;font:inherit}
.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.k{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px}.k b{display:block;font-size:20px;margin-top:2px}.k span{color:var(--mu);font-size:12px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:14px}.card h3{margin:0 0 8px;font-size:14px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}
th,td{padding:7px 9px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mu);font-size:12px;font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.cl{cursor:pointer}tr.cl:hover{background:var(--bg)}
.chip{padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid currentColor}
.Paid{color:var(--ok)}.Partial{color:var(--wn)}.Unpaid{color:var(--mu)}.Overdue{color:var(--er)}
.bar{height:8px;background:var(--bd);border-radius:4px;overflow:hidden;min-width:90px}.bar i{display:block;height:100%;background:var(--ok)}
.f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
input,select{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:7px;background:var(--cd);color:var(--tx);max-width:100%}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--cd);color:var(--tx);width:min(560px,94vw);padding:16px}dialog::backdrop{background:#0007}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fg label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}.fg .w{grid-column:1/-1}
.row{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--bd)}.neg{color:var(--er)}
@media(max-width:520px){.fg{grid-template-columns:1fr}}
</style></head><body>
<header><h1>MIPL Billing &amp; Payment Tracker<small>Maha Infotech Pvt Ltd · dummy data for demo</small></h1>
<div class="f" style="margin:0"><button class="btn p" onclick="newInv()">+ New invoice</button><button class="btn" onclick="csv()">Export CSV</button><button class="btn" onclick="resetD()">Reset demo data</button></div></header>
<nav id="nav"></nav><main id="m"></main><dialog id="dlg"></dialog>
<script>
const SITES=["Chhatrapati Sambhajinagar","Panvel","Mangalore","Jammu & Kashmir","Madhya Pradesh"];
const PR=[
["Smart City Road Package PMC","Chhatrapati Sambhajinagar","Aurangabad Smart City Dev. Corp.",85,2.5,5],
["Water Grid Supervision","Chhatrapati Sambhajinagar","Maharashtra Jeevan Pradhikaran",120,1.8,5],
["Affordable Housing PMC","Panvel","CIDCO (PSU)",210,1.5,5],
["STP & Drainage Project","Panvel","Panvel Municipal Corporation",64,2.2,0],
["Berth Upgrade PMC","Mangalore","New Mangalore Port Authority",150,1.75,5],
["Refinery Expansion PMC","Mangalore","Mangalore Refinery & Petrochemicals Ltd (MRPL)",48,2.4,0],
["Tunnel Approach Road Supervision","Jammu & Kashmir","NHIDCL",310,1.2,5],
["Bridges Package (R&B)","Jammu & Kashmir","J&K Public Works Dept",72,2,5],
["State Highway Upgrade","Madhya Pradesh","MP Road Development Corp",190,1.6,5],
["Rural Water Supply","Madhya Pradesh","MP Jal Nigam",95,2.1,0]].map((p,i)=>({id:"P"+(i+1),name:p[0],site:p[1],client:p[2],cost:p[3]*1e7,fee:p[4],ret:p[5]}));
const MS=[["Inception Report",15],["Design / DPR Stage",25],["Construction Stage 1",25],["Construction Stage 2",20],["Completion & Handover",15]];
const T=new Date(),KEY="mipl_billing_v1";
const ad=(d,n)=>{let x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const age=d=>Math.floor((T-new Date(d))/864e5);
const f=n=>"₹"+Math.round(n).toLocaleString("en-IN");
const c=n=>n>=1e7?"₹"+(n/1e7).toFixed(2)+" Cr":n>=1e5?"₹"+(n/1e5).toFixed(2)+" L":f(n);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
let D,view="dash",F={site:"",st:"",q:""};
function seed(){let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;const inv=[],pay=[];let n=1;
PR.forEach((p,k)=>{const cnt=3+k%3;for(let i=0;i<cnt;i++){const date=ad("2025-12-01",k*12+i*50+Math.floor(r()*8));if(new Date(date)>T)break;
const base=Math.round(p.cost*p.fee/100*MS[i][1]/100);
const v={id:"I"+n,no:"MIPL/"+p.site.slice(0,3).toUpperCase()+"/25-26/"+String(n).padStart(3,"0"),pid:p.id,date,ms:MS[i][0],base,gst:18,tdsIT:10,tdsGST:2,ret:p.ret,pen:r()<.2?Math.round(base*.01):0,oth:r()<.15?Math.round(base*.005):0,cert:i<cnt-2&&r()<.7};inv.push(v);
const net=calc(v).net;let amt=i<cnt-2?net:i==cnt-2?Math.round(net*.6):0;const pd=ad(date,25+Math.floor(r()*50));
if(amt>0&&new Date(pd)<=T)pay.push({inv:v.id,date:pd,amt,utr:"UTR"+Math.floor(1e11+r()*9e11),mode:r()<.6?"RTGS":"NEFT"});n++}});
return{inv,pay}}
function load(){try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!D)D=seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function calc(v){const gst=v.base*v.gst/100,gross=v.base+gst,tIT=v.base*v.tdsIT/100,tG=v.base*v.tdsGST/100,rt=v.base*v.ret/100,ded=tIT+tG+rt+v.pen+v.oth,net=gross-ded;
const pays=(D?D.pay:[]).filter(p=>p.inv==v.id),rec=pays.reduce((a,p)=>a+p.amt,0),bal=Math.round(net-rec),a=age(v.date);
const st=bal<=0?"Paid":a>45?"Overdue":rec>0?"Partial":"Unpaid";return{gst,gross,tIT,tG,rt,ded,net,rec,bal:Math.max(bal,0),age:a,st,pays}}
const P=id=>PR.find(p=>p.id==id);
const rows=()=>D.inv.map(v=>({v,p:P(v.pid),c:calc(v)}));
const sum=(a,fn)=>a.reduce((s,x)=>s+fn(x),0);
function nav(){document.getElementById("nav").innerHTML=[["dash","Dashboard"],["inv","Invoices"],["pro","Projects"],["pay","Payments ledger"]].map(t=>`<button class="${view==t[0]?"on":""}" onclick="view='${t[0]}';render()">${t[1]}</button>`).join("")}
function render(){nav();document.getElementById("m").innerHTML={dash,inv,pro,pay}[view]()}
function dash(){const R=rows(),o=R.filter(x=>x.c.bal>0);
const K=[["Gross billed (incl. GST)",sum(R,x=>x.c.gross)],["Total deductions",sum(R,x=>x.c.ded)],["Net receivable",sum(R,x=>x.c.net)],["Received",sum(R,x=>x.c.rec)],["Outstanding",sum(R,x=>x.c.bal)],["Overdue (>45 days)",sum(R.filter(x=>x.c.st=="Overdue"),x=>x.c.bal)]];
const bk=[["0-30 days",0,30],["31-60",31,60],["61-90",61,90],["90+",91,1e5]].map(b=>[b[0],sum(o.filter(x=>x.c.age>=b[1]&&x.c.age<=b[2]),x=>x.c.bal)]);
const dd=[["TDS – Income Tax (10%)","tIT"],["TDS – GST (2%)","tG"],["Retention / Security","rt"]].map(d=>[d[0],sum(R,x=>x.c[d[1]])]).concat([["Penalty / LD",sum(R,x=>x.v.pen)],["Other deductions",sum(R,x=>x.v.oth)]]);
const certPend=sum(R.filter(x=>!x.v.cert&&x.c.rec>0),x=>x.c.tIT);
return`<div class="grid">${K.map((k,i)=>`<div class="k"><span>${k[0]}</span><b class="${i==5?"neg":""}">${c(k[1])}</b></div>`).join("")}</div>
<div class="card sc"><h3>Site-wise position</h3><table><tr><th>Site</th><th class="n">Gross billed</th><th class="n">Deductions</th><th class="n">Received</th><th class="n">Outstanding</th><th>Recovery</th></tr>${SITES.map(s=>{const a=R.filter(x=>x.p.site==s),net=sum(a,x=>x.c.net),rec=sum(a,x=>x.c.rec);return`<tr><td>${s}</td><td class="n">${c(sum(a,x=>x.c.gross))}</td><td class="n">${c(sum(a,x=>x.c.ded))}</td><td class="n">${c(rec)}</td><td class="n">${c(net-rec)}</td><td><div class="bar"><i style="width:${net?rec/net*100:0}%"></i></div></td></tr>`}).join("")}</table></div>
<div class="two"><div class="card"><h3>Outstanding ageing</h3>${bk.map(b=>`<div class="row"><span>${b[0]}</span><b>${c(b[1])}</b></div>`).join("")}</div>
<div class="card"><h3>Where the deductions went</h3>${dd.map(b=>`<div class="row"><span>${b[0]}</span><b>${c(b[1])}</b></div>`).join("")}<div class="row"><span>TDS certificates pending (est. IT TDS)</span><b class="neg">${c(certPend)}</b></div></div></div>
<div class="card sc"><h3>Top overdue invoices</h3><table><tr><th>Invoice</th><th>Client</th><th class="n">Balance</th><th class="n">Age</th></tr>${R.filter(x=>x.c.st=="Overdue").sort((a,b)=>b.c.bal-a.c.bal).slice(0,6).map(x=>`<tr class="cl" onclick="detail('${x.v.id}')"><td>${esc(x.v.no)}</td><td>${esc(x.p.client)}</td><td class="n">${f(x.c.bal)}</td><td class="n">${x.c.age} d</td></tr>`).join("")}</table></div>`}
function inv(){let R=rows().filter(x=>(!F.site||x.p.site==F.site)&&(!F.st||x.c.st==F.st)&&(!F.q||(x.v.no+x.p.name+x.p.client).toLowerCase().includes(F.q.toLowerCase())));
return`<div class="f"><select onchange="F.site=this.value;render()"><option value="">All sites</option>${SITES.map(s=>`<option ${F.site==s?"selected":""}>${s}</option>`).join("")}</select><select onchange="F.st=this.value;render()"><option value="">All status</option>${["Paid","Partial","Unpaid","Overdue"].map(s=>`<option ${F.st==s?"selected":""}>${s}</option>`).join("")}</select><input placeholder="Search invoice / client / project" value="${esc(F.q)}" onchange="F.q=this.value;render()"></div>
<div class="card sc"><table><tr><th>Invoice</th><th>Date</th><th>Project / Client</th><th>Milestone</th><th class="n">Base fee</th><th class="n">GST</th><th class="n">Deductions</th><th class="n">Net payable</th><th class="n">Received</th><th class="n">Balance</th><th class="n">Age</th><th>Status</th></tr>
${R.map(x=>`<tr class="cl" onclick="detail('${x.v.id}')"><td>${esc(x.v.no)}</td><td>${x.v.date}</td><td>${esc(x.p.name)}<br><small style="color:var(--mu)">${esc(x.p.client)}</small></td><td>${esc(x.v.ms)}</td><td class="n">${f(x.v.base)}</td><td class="n">${f(x.c.gst)}</td><td class="n neg">${f(x.c.ded)}</td><td class="n">${f(x.c.net)}</td><td class="n">${f(x.c.rec)}</td><td class="n">${f(x.c.bal)}</td><td class="n">${x.c.age}</td><td><span class="chip ${x.c.st}">${x.c.st}</span></td></tr>`).join("")||"<tr><td colspan='12'>No invoices match.</td></tr>"}</table></div>`}
function pro(){return`<div class="card sc"><table><tr><th>Project</th><th>Site</th><th>Authority</th><th class="n">Project cost</th><th class="n">Fee %</th><th class="n">Contract fee</th><th class="n">Billed (base)</th><th>Billed %</th><th class="n">Received</th><th class="n">Outstanding</th></tr>${PR.map(p=>{const a=rows().filter(x=>x.p.id==p.id),fee=p.cost*p.fee/100,b=sum(a,x=>x.v.base);return`<tr><td>${esc(p.name)}</td><td>${p.site}</td><td>${esc(p.client)}</td><td class="n">${c(p.cost)}</td><td class="n">${p.fee}%</td><td class="n">${c(fee)}</td><td class="n">${c(b)}</td><td><div class="bar"><i style="width:${b/fee*100}%;background:var(--ac)"></i></div></td><td class="n">${c(sum(a,x=>x.c.rec))}</td><td class="n">${c(sum(a,x=>x.c.bal))}</td></tr>`}).join("")}</table></div>`}
function pay(){const L=D.pay.map(p=>({p,v:D.inv.find(v=>v.id==p.inv)})).sort((a,b)=>b.p.date.localeCompare(a.p.date));
return`<div class="card sc"><table><tr><th>Date</th><th>Invoice</th><th>Client</th><th>Site</th><th>Mode</th><th>UTR / Ref</th><th class="n">Amount</th></tr>${L.map(x=>`<tr><td>${x.p.date}</td><td>${esc(x.v.no)}</td><td>${esc(P(x.v.pid).client)}</td><td>${P(x.v.pid).site}</td><td>${x.p.mode}</td><td>${esc(x.p.utr)}</td><td class="n">${f(x.p.amt)}</td></tr>`).join("")}<tr><th colspan="6">Total received</th><th class="n">${f(sum(D.pay,p=>p.amt))}</th></tr></table></div>`}
function open_(h){const d=document.getElementById("dlg");d.innerHTML=h;d.showModal()}
function close_(){document.getElementById("dlg").close()}
function detail(id){const v=D.inv.find(x=>x.id==id),p=P(v.pid),k=calc(v),r=(a,b,cl)=>`<div class="row"><span>${a}</span><b class="${cl||""}">${b}</b></div>`;
open_(`<h3 style="margin-top:0">${esc(v.no)} <span class="chip ${k.st}">${k.st}</span></h3><div style="color:var(--mu)">${esc(p.name)} · ${esc(p.client)} · ${p.site}<br>${esc(v.ms)} · ${v.date} · ${k.age} days old</div><br>
${r("Base consultancy fee",f(v.base))}${r("GST @"+v.gst+"%","+ "+f(k.gst))}${r("Gross invoice value",f(k.gross))}
${r("TDS – Income Tax @"+v.tdsIT+"%","− "+f(k.tIT),"neg")}${r("TDS – GST @"+v.tdsGST+"%","− "+f(k.tG),"neg")}${r("Retention @"+v.ret+"%","− "+f(k.rt),"neg")}${r("Penalty / LD","− "+f(v.pen),"neg")}${r("Other deductions","− "+f(v.oth),"neg")}
${r("Net payable",f(k.net))}${r("Received",f(k.rec))}${r("Balance due",f(k.bal),k.bal?"neg":"")}
<p style="margin:10px 0 4px"><b>Payments</b></p>${k.pays.map(x=>`<div class="row"><span>${x.date} · ${x.mode} · ${esc(x.utr)}</span><b>${f(x.amt)}</b></div>`).join("")||"<div style='color:var(--mu)'>None yet</div>"}
<p><label><input type="checkbox" ${v.cert?"checked":""} onchange="D.inv.find(x=>x.id=='${id}').cert=this.checked;save()"> TDS certificate (Form 16A) received</label></p>
<div class="f"><button class="btn" onclick="close_()">Close</button>${k.bal>0?`<button class="btn p" onclick="payF('${id}')">Record payment</button>`:""}<button class="btn" onclick="if(confirm('Delete this invoice and its payments?')){D.pay=D.pay.filter(x=>x.inv!='${id}');D.inv=D.inv.filter(x=>x.id!='${id}');save();close_();render()}">Delete</button></div>`)}
function payF(id){const v=D.inv.find(x=>x.id==id),k=calc(v);open_(`<h3 style="margin-top:0">Record payment – ${esc(v.no)}</h3><div class="fg"><label>Amount received (₹)<input id="pa" type="number" value="${k.bal}"></label><label>Date<input id="pd" type="date" value="${T.toISOString().slice(0,10)}"></label><label>Mode<select id="pm"><option>RTGS</option><option>NEFT</option><option>Cheque</option><option>PFMS</option></select></label><label>UTR / Cheque no.<input id="pu"></label></div><p style="color:var(--mu)">Balance due: ${f(k.bal)}</p><div class="f"><button class="btn" onclick="close_()">Cancel</button><button class="btn p" onclick="addPay('${id}',${k.bal})">Save</button></div>`)}
function addPay(id,bal){const a=+pa.value;if(!(a>0)||a>bal){alert("Enter an amount between 1 and the balance due.");return}D.pay.push({inv:id,date:pd.value,amt:a,utr:pu.value||"—",mode:pm.value});save();close_();render()}
function newInv(){open_(`<h3 style="margin-top:0">New invoice</h3><div class="fg"><label class="w">Project<select id="np" onchange="pv()">${PR.map(p=>`<option value="${p.id}">${esc(p.name)} – ${p.site}</option>`).join("")}</select></label><label>Milestone<input id="nm" value="Milestone bill"></label><label>Invoice date<input id="nd" type="date" value="${T.toISOString().slice(0,10)}"></label><label>% of contract fee<input id="nx" type="number" value="15" oninput="pv()"></label><label>GST %<input id="ng" type="number" value="18" oninput="pv()"></label><label>TDS-IT %<input id="ni" type="number" value="10" oninput="pv()"></label><label>TDS-GST %<input id="nt" type="number" value="2" oninput="pv()"></label><label>Retention %<input id="nr" type="number" value="5" oninput="pv()"></label><label>Penalty (₹)<input id="nl" type="number" value="0" oninput="pv()"></label><label>Other deduction (₹)<input id="no" type="number" value="0" oninput="pv()"></label></div><div id="pvw" class="card" style="margin-top:10px"></div><div class="f"><button class="btn" onclick="close_()">Cancel</button><button class="btn p" onclick="addInv()">Create</button></div>`);pv()}
function mk(){const p=P(np.value);return{id:"I"+Date.now(),no:"MIPL/"+p.site.slice(0,3).toUpperCase()+"/26-27/"+String(D.inv.length+1).padStart(3,"0"),pid:p.id,date:nd.value,ms:nm.value,base:Math.round(p.cost*p.fee/100*(+nx.value)/100),gst:+ng.value,tdsIT:+ni.value,tdsGST:+nt.value,ret:+nr.value,pen:+nl.value,oth:+no.value,cert:false}}
function pv(){const v=mk(),k=calc(v);pvw.innerHTML=`<div class="row"><span>Base fee</span><b>${f(v.base)}</b></div><div class="row"><span>Gross (with GST)</span><b>${f(k.gross)}</b></div><div class="row"><span>Total deductions</span><b class="neg">${f(k.ded)}</b></div><div class="row"><span>Expected net receipt</span><b>${f(k.net)}</b></div>`}
function addInv(){D.inv.push(mk());save();close_();view="inv";render()}
function csv(){const h=["Invoice","Date","Site","Client","Project","Milestone","Base","GST","TDS-IT","TDS-GST","Retention","Penalty","Other","Net","Received","Balance","Status"];
const L=rows().map(x=>[x.v.no,x.v.date,x.p.site,x.p.client,x.p.name,x.v.ms,x.v.base,x.c.gst,x.c.tIT,x.c.tG,x.c.rt,x.v.pen,x.v.oth,x.c.net,x.c.rec,x.c.bal,x.c.st].map(z=>'"'+String(typeof z=="number"?Math.round(z):z).replace(/"/g,'""')+'"').join(","));
const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent([h.join(",")].concat(L).join("\n"));a.download="mipl-billing.csv";a.click()}
function resetD(){if(confirm("Reset to original demo data? Your changes will be lost.")){try{localStorage.removeItem(KEY)}catch(e){}D=seed();render()}}
load();render();
</script></body></html>
